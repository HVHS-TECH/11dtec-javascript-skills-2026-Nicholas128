<!DOCTYPE html>
<html lang="en">

<head>
  <title>T15-for-loop</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- stylesheets *******************************************-->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/dtec_favicon.png">
</head>

<!--*************************************************************
  BODY
**************************************************************-->

<body>
  <h1>T15-for-loop</h1>
  <p>Open the console <code>(Ctrl-shift-i)</code> to see the messages.</p>
<button onclick="start()">Start</button>

  

<form  onsubmit="return false;">
  <label for="formName">Name:</label>
  <input type="text" id="nameField" name="formName">
<input type="submit" onClick="getNameInput()">
</form>
<form  onsubmit="return false;">
  <label for="formAge">Your age:</label>
  <input type="text" id="ageField" name="formAge">
<input type="submit" onClick="getAgeInput()">
</form>
<form  onsubmit="return false;">
  <label for="formPocketMoney">Your amount of money $:</label>
  <input type="text" id="pocketMoneyField" name="formPocketMoney">
<input type="submit" onClick="getPocketMoneyInput()">
</form>

<form onsubmit="return false;">
   <label for="formScale">On a scale of 0-3 how much do you like chocolate ?</label>
  <input type="text" id="chooseField" name="formScale">
  <input type="submit" onClick="scale()">
</form>

<form onsubmit="return false;">
   <label for="formNumber">How many verses would you like ?</label>
  <input type="text" id="numberField" name="formNumber" value="">
  <input type="submit" onClick="number()">
</form>







<div id="spaceForJavaScriptOutput">



  </div>


  <script src="../t15_for_loop.js"></script>


</body>

</html>
<!--*************************************************************
  END OF T15_for_loop_HTML
**************************************************************-->
